name: Update Deep-Sync News Wire

on:
  # Scheduled cron disabled — needs a funded ANTHROPIC_API_KEY, which we're not
  # paying for right now. Claude drafts the digest manually via chat instead
  # (see NEWS-WIRE-README.md). Re-enable the schedule block below if the API
  # key gets funded again.
  # schedule:
  #   - cron: "0 6 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab, for manual runs / testing
  push:
    branches: [main]
    paths:
      - ".github/radar-trigger"

permissions:
  contents: write         # needed so the workflow can push the draft branch
  pull-requests: write    # needed so the workflow can open/update the review PR

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate news and open calls
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/generate-news.mjs

      - name: Show safe radar status
        if: always()
        run: cat data/radar-status.json || true

      - name: Open review PR if changed
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update news wire draft"
          title: "News wire draft — ${{ github.run_id }}"
          body: |
            Automated Deep-Sync News Wire draft. Review the news items and open calls below,
            then merge this PR to publish them to the live site (or close it to discard).
          branch: auto/news-wire-update
          delete-branch: true
          add-paths: |
            data/news.json
            data/calls.json
            data/radar-status.json
